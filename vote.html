<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>US↔Japan Training — Phone Interaction</title><style>
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--navy:#202124;--paper:#fffaf3;--line:#e8dcc9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Inter,Arial,sans-serif;padding:18px}main{max-width:680px;margin:0 auto}.top{position:sticky;top:0;background:rgba(255,250,243,.96);backdrop-filter:blur(8px);padding:10px 0 14px;border-bottom:1px solid var(--line);z-index:2}h1{font-size:28px;line-height:1.05;margin:0 0 6px}p{line-height:1.35;color:#4b5360}section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:16px 0;box-shadow:0 12px 34px rgba(17,24,39,.07)}h2{font-size:20px;margin:0 0 10px}button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;margin:7px 0;font-weight:850;font-size:16px;box-shadow:0 4px 14px rgba(17,24,39,.04)}button:active{transform:scale(.99)}button[disabled]{opacity:.55;background:#f3f4f6}button.selected{border-color:var(--green);background:#effbf2}.sent{position:fixed;left:16px;right:16px;bottom:16px;background:#202124;color:#fff;padding:13px 16px;border-radius:16px;text-align:center;font-weight:900;opacity:0;transform:translateY(12px);transition:.2s}.sent.show{opacity:1;transform:translateY(0)}.tiny{font-size:12px;color:#6b7280}.scenario{border-left:6px solid var(--yellow);padding-left:12px}
</style></head><body><main><div class="top"><h1>US↔Japan workshop</h1><p>Send your answer to the facilitator slide. No login, no personal data.</p><p class="tiny">One answer per question on this phone.</p></div>
<section data-question="diagnosis"><h2>Room diagnosis vote</h2><p class="scenario">A A proposal stalls after polite client feedback. Which lens is most useful first?</p><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'Hall: the signal was indirect / contextual'})">Hall: the signal was indirect / contextual</button><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'Hofstede: the proposal felt under-controlled'})">Hofstede: the proposal felt under-controlled</button><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'Trompenaars: the route through roles was wrong'})">Trompenaars: the route through roles was wrong</button><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'World Values Survey: disagreement needed a safer channel'})">World Values Survey: disagreement needed a safer channel</button></section>
<section data-question="signal"><h2>Signal decoder</h2><button onclick="sendOnce(this,{type:'feedback',slide:'Signal decoder',ok:true,text:'Phone answer: concern needs solving before forward motion.'})">A concern needs solving before forward motion.</button><button onclick="sendOnce(this,{type:'feedback',slide:'Signal decoder',ok:false,text:'Phone answer: risky — pushing for a date may miss the indirect concern.'})">They are almost ready; push for a date.</button><button onclick="sendOnce(this,{type:'feedback',slide:'Signal decoder',ok:false,text:'Phone answer: too strong — do not infer dislike from one indirect phrase.'})">They dislike the platform proposal.</button><button onclick="sendOnce(this,{type:'feedback',slide:'Signal decoder',ok:false,text:'Phone answer: risky — immediate yes/no pressure can create face pressure.'})">Ask for a yes/no answer immediately.</button></section>
<section data-question="proposal"><h2>Safe test card</h2><button onclick="sendOnce(this,{type:'feedback',slide:'Safe test card',ok:true,text:'Phone answer: scope reduces uncertainty avoidance pressure.'})">Scope: inventory, audience, budget cap, dates.</button><button onclick="sendOnce(this,{type:'feedback',slide:'Safe test card',ok:true,text:'Phone answer: rollback trigger makes the proposal safer.'})">Fallback and rollback trigger.</button><button onclick="sendOnce(this,{type:'feedback',slide:'Safe test card',ok:true,text:'Phone answer: reporting cadence builds predictability.'})">Weekly reporting cadence.</button><button onclick="sendOnce(this,{type:'feedback',slide:'Safe test card',ok:false,text:'Phone answer: risky — fast launch without sign-off is not enough.'})">Launch fast and optimize later.</button></section>
<div id="sent" class="sent">Sent to slide</div></main><script>
const topic='google-japan-training-usjp-live-final-8d2fe2f';
function flash(t){const el=document.getElementById('sent');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}
function markAnswered(section,key,button){section.querySelectorAll('button').forEach(b=>b.disabled=true);button.classList.add('selected');localStorage.setItem('usjp_phone_'+key,'1')}
function restoreAnswered(){document.querySelectorAll('section[data-question]').forEach(s=>{const key=s.dataset.question;if(localStorage.getItem('usjp_phone_'+key))s.querySelectorAll('button').forEach(b=>b.disabled=true);})}
async function sendOnce(button,payload){const section=button.closest('section[data-question]');const key=section.dataset.question;if(localStorage.getItem('usjp_phone_'+key)){flash('Already answered this question');return;}payload.ts=Date.now();payload.sender='phone';payload.device=localStorage.usjp_phone_device||(localStorage.usjp_phone_device=Math.random().toString(36).slice(2));try{await fetch('https://ntfy.sh/'+topic,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});markAnswered(section,key,button);flash('Sent to facilitator slide');}catch(e){flash('Could not send — check connection');}}
restoreAnswered();
</script></body></html>
