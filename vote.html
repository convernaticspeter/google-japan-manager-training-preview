<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>US↔Japan Training — Phone Interaction</title><style>
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--navy:#202124;--paper:#fffaf3;--line:#e8dcc9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Inter,Arial,sans-serif;padding:18px}main{max-width:680px;margin:0 auto}.top{position:sticky;top:0;background:rgba(255,250,243,.96);backdrop-filter:blur(8px);padding:10px 0 14px;border-bottom:1px solid var(--line);z-index:2}h1{font-size:28px;line-height:1.05;margin:0 0 6px}p{line-height:1.35;color:#4b5360}section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:16px 0;box-shadow:0 12px 34px rgba(17,24,39,.07)}h2{font-size:20px;margin:0 0 10px}button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;margin:7px 0;font-weight:850;font-size:16px;box-shadow:0 4px 14px rgba(17,24,39,.04)}button:active{transform:scale(.99)}.sent{position:fixed;left:16px;right:16px;bottom:16px;background:#202124;color:#fff;padding:13px 16px;border-radius:16px;text-align:center;font-weight:900;opacity:0;transform:translateY(12px);transition:.2s}.sent.show{opacity:1;transform:translateY(0)}.tiny{font-size:12px;color:#6b7280}
</style></head><body><main><div class="top"><h1>US↔Japan workshop</h1><p>Send your answer to the facilitator slide. No login, no personal data.</p><p class="tiny">Live channel: google-japan-training-usjp-live-7f3c2</p></div>
<section><h2>Room diagnosis vote</h2><button onclick="send({type:'poll',poll:'diagnosis',value:'Hall: meaning outside words'})">Hall: the signal was indirect/contextual</button><button onclick="send({type:'poll',poll:'diagnosis',value:'Hofstede: uncertainty/risk control'})">Hofstede: the pilot felt under-controlled</button><button onclick="send({type:'poll',poll:'diagnosis',value:'Trompenaars: relationship/status route'})">Trompenaars: the route through roles was wrong</button><button onclick="send({type:'poll',poll:'diagnosis',value:'WVS: safer public voice channel'})">World Values Survey: disagreement needed a safer channel</button></section>
<section><h2>Signal decoder</h2><button onclick="send({type:'feedback',slide:'Signal decoder',ok:true,text:'Phone answer: concern needs solving before forward motion.'})">A concern needs solving before forward motion.</button><button onclick="send({type:'feedback',slide:'Signal decoder',ok:false,text:'Phone answer: risky — pushing for a date may miss the indirect concern.'})">They are almost ready; push for a date.</button><button onclick="send({type:'feedback',slide:'Signal decoder',ok:false,text:'Phone answer: too strong — do not infer dislike from one indirect phrase.'})">They dislike the platform proposal.</button><button onclick="send({type:'feedback',slide:'Signal decoder',ok:false,text:'Phone answer: risky — immediate yes/no pressure can create face pressure.'})">Ask for a yes/no answer immediately.</button></section>
<section><h2>Dimension sort</h2><button onclick="send({type:'sort',text:'Phone sort: The client says little, but timing and tone change. → Hall'})">Client says little, but timing and tone change.</button><button onclick="send({type:'sort',text:'Phone sort: The team asks for risk controls before a pilot. → Hofstede'})">Team asks for risk controls before a pilot.</button><button onclick="send({type:'sort',text:'Phone sort: Policy is correct, but the route is wrong. → Trompenaars'})">Policy is correct, but the route is wrong.</button><button onclick="send({type:'sort',text:'Phone sort: People avoid public disagreement. → World Values Survey / Hall'})">People avoid public disagreement.</button></section>
<section><h2>Proposal lab</h2><button onclick="send({type:'feedback',slide:'Proposal lab',ok:true,text:'Phone answer: scope reduces uncertainty avoidance pressure.'})">Scope: inventory, audience, budget cap, dates.</button><button onclick="send({type:'feedback',slide:'Proposal lab',ok:true,text:'Phone answer: rollback trigger makes the pilot safer.'})">Rollback trigger and escalation path.</button><button onclick="send({type:'feedback',slide:'Proposal lab',ok:true,text:'Phone answer: reporting cadence builds predictability.'})">Weekly reporting cadence.</button><button onclick="send({type:'feedback',slide:'Proposal lab',ok:false,text:'Phone answer: risky — fast launch without sign-off is not enough.'})">Launch fast and optimize later.</button></section>
<div id="sent" class="sent">Sent to slide</div></main><script>
const topic='google-japan-training-usjp-live-7f3c2';
function flash(t){const el=document.getElementById('sent');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1100)}
async function send(payload){payload.ts=Date.now();payload.sender='phone';try{await fetch('https://ntfy.sh/'+topic,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});flash('Sent to facilitator slide');}catch(e){flash('Could not send — check connection');}}
</script></body></html>
