<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>US↔Japan Training — Phone Interaction</title><style>
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--navy:#202124;--paper:#fffaf3;--line:#e8dcc9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Inter,Arial,sans-serif;padding:18px}main{max-width:680px;margin:0 auto}.top{position:sticky;top:0;background:rgba(255,250,243,.96);backdrop-filter:blur(8px);padding:10px 0 14px;border-bottom:1px solid var(--line);z-index:2}h1{font-size:28px;line-height:1.05;margin:0 0 6px}p{line-height:1.35;color:#4b5360}section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:16px 0;box-shadow:0 12px 34px rgba(17,24,39,.07)}h2{font-size:20px;margin:0 0 10px}button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;margin:7px 0;font-weight:850;font-size:16px;box-shadow:0 4px 14px rgba(17,24,39,.04)}button:active{transform:scale(.99)}button[disabled]{opacity:.55;background:#f3f4f6}button.selected{border-color:var(--green);background:#effbf2}.sent{position:fixed;left:16px;right:16px;bottom:16px;background:#202124;color:#fff;padding:13px 16px;border-radius:16px;text-align:center;font-weight:900;opacity:0;transform:translateY(12px);transition:.2s}.sent.show{opacity:1;transform:translateY(0)}.tiny{font-size:12px;color:#6b7280}.scenario{border-left:6px solid var(--yellow);padding-left:12px}
</style></head><body><main><div class="top"><h1>US↔Japan workshop</h1><p>Send your answer to the facilitator result slide. No login, no personal data.</p><p class="tiny">One answer per question on this phone.</p></div>
<section data-question="diagnosis"><h2>Room diagnosis vote</h2><p class="scenario">A proposal stalls after polite client feedback. Which lens is most useful first?</p><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'Hall: the signal was indirect / contextual'})">Hall: the signal was indirect / contextual</button><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'Hofstede: the proposal felt under-controlled'})">Hofstede: the proposal felt under-controlled</button><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'Trompenaars: the route through roles was wrong'})">Trompenaars: the route through roles was wrong</button><button onclick="sendOnce(this,{type:'poll',poll:'diagnosis',value:'World Values Survey: disagreement needed a safer channel'})">World Values Survey: disagreement needed a safer channel</button></section>


<div class="sent" id="sent">Sent to slide</div></main><script>
const topic='google-japan-training-usjp-live-3580679-fixvote';
const phonePrefix='usjp_phone_';
function flash(t){const el=document.getElementById('sent');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}
function questionKey(section){return phonePrefix+section.dataset.question}
function markAnswered(section,key,button){section.querySelectorAll('button').forEach(b=>b.disabled=true);button.classList.add('selected');localStorage.setItem(key,String(Date.now()))}
function clearAnswered(){document.querySelectorAll('section[data-question]').forEach(s=>{localStorage.removeItem(questionKey(s));s.querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('selected')})})}
function restoreAnswered(){document.querySelectorAll('section[data-question]').forEach(s=>{if(localStorage.getItem(questionKey(s)))s.querySelectorAll('button').forEach(b=>b.disabled=true);})}
function clearIfResetNewer(resetTs){if(!resetTs)return;document.querySelectorAll('section[data-question]').forEach(s=>{const key=questionKey(s);const answered=Number(localStorage.getItem(key)||0);if(answered && answered<=resetTs){localStorage.removeItem(key);s.querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('selected')})}});localStorage.setItem(phonePrefix+'last_reset',String(resetTs));}
async function syncResetState(){try{const r=await fetch('https://ntfy.sh/'+topic+'/json?poll=1');const txt=await r.text();let latest=0;txt.trim().split('\n').filter(Boolean).forEach(line=>{try{const msg=JSON.parse(line);const payload=JSON.parse(msg.message||'{}');if(payload.type==='reset')latest=Math.max(latest,Number(payload.ts)||0);}catch(e){}});if(latest){clearIfResetNewer(latest);restoreAnswered();}}catch(e){}}
async function sendOnce(button,payload){const section=button.closest('section[data-question]');const key=questionKey(section);if(localStorage.getItem(key)){flash('Already answered this question');return;}payload.ts=Date.now();payload.sender='phone';payload.device=localStorage.usjp_phone_device||(localStorage.usjp_phone_device=Math.random().toString(36).slice(2));payload.eventId=payload.eventId||payload.device+'-'+payload.ts+'-'+Math.random().toString(36).slice(2);try{await fetch('https://ntfy.sh/'+topic,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});markAnswered(section,key,button);flash('Sent to facilitator slide');}catch(e){flash('Could not send — check connection');}}
function listenForReset(){if(!window.EventSource)return;try{const es=new EventSource('https://ntfy.sh/'+topic+'/sse');es.onmessage=(ev)=>{try{const msg=JSON.parse(ev.data||'{}');const payload=JSON.parse(msg.message||'{}');if(payload.type==='reset'){clearIfResetNewer(Number(payload.ts)||Date.now());clearAnswered();flash('Reset received — you can vote again');}}catch(e){}};}catch(e){}}
restoreAnswered();
syncResetState();
listenForReset();
</script></body></html>
